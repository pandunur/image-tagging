name: CI

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps: 
      - name: checkout repository
        uses: actions/checkout@v4
      
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      
      - name: install dependencies
        run: python -m pip install -r requirements.txt
      
      - name: run unit test
        run: python -m pytest test/test_app.py

  docker:
    needs: test

    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t my-repo:${{ github.sha }} .
     
      - name: show docker image
        run: docker images my-repo

      - name: run docker container
        run: |
          docker run \
            -d -p 8080:8080 \
              --name my-repo \
                my-repo:${{ github.sha }}
  
  docker-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::267544548136:role/github-actions-ecr
          aws-region: ap-southeast-3

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-southeast-3 | \
            docker login \
              --username AWS \
              --password-stdin 267544548136.dkr.ecr.ap-southeast-3.amazonaws.com

      - name: Build Docker image
        run: docker build -t my-repo:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag \
            user-service:${{ github.sha }} \
            267544548136.dkr.ecr.ap-southeast-3.amazonaws.com/user-service:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            267544548136.dkr.ecr.ap-southeast-3.amazonaws.com/user-service:${{ github.sha }}